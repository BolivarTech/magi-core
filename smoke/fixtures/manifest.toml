# Fixture manifest. EMPTY in E1 by design — see smoke/src/fixtures.rs.
#
# No E1 scenario replays a fixture: the twelve E1 scenarios run against the
# real backend through the spy proxy, and R12's injection is enough for
# rotation and degradation without replay. Populating this file now, ahead of
# the scenarios that would consume the entries, would trip the orphan check
# and make the harness refuse to run in its own milestone. The corpus and its
# entries arrive together, starting with F0 of MS1.
#
# The manifest is GENERATED by smoke/sync-fixtures.sh, never hand-edited: a
# hand-written hash is a hash that can match nothing.
#
# manifest.toml — one entry PER (scenario, fixture) PAIR.
#
# A fixture used by two scenarios appears twice: same path, same hash, but its
# OWN currency line — currency is a property of WHAT IT IS USED FOR, not of
# the file. Collapsing the entries would force one currency answer for two
# questions.
#
# INTEGRITY is not CURRENCY: the hash proves the file is the one we recorded,
# NOT that the backend still answers that way. Only a live scenario proves
# currency.
#
# [[fixture]]
# scenario = "S9"                          # must be in the LIVE list of the stage
# path     = "native-E-malformed.json"
# sha256   = "<64 lowercase hex>"
# currency = "verificada-por: S9b"         # or "sin-verificar: <reason>"
