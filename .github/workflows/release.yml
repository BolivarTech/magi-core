name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --check
      # --all-targets, not --tests: examples are linted too, and the examples build below is the
      # ONLY check able to catch an external-construction regression of the error type.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The default feature set is a supported configuration and has its own dead-code surface;
      # linting only --all-features hid exactly that during this milestone.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run --all-features
      - run: cargo nextest run
      # The gates this crate relies on to stay correct. They were absent from the PUBLISHING path
      # while present in CI, so a tag on any commit other than a gated `main` shipped without them.
      - run: sh ci/check_r0.sh
      - run: bash ci/check_redaction.sh --self-test
      - run: bash ci/check_redaction.sh
      - run: bash ci/check_calibration.sh
      - run: cargo build --all-features --examples
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo generate-lockfile
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  publish:
    name: Publish to crates.io
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - name: Verify tag matches Cargo.toml version
        run: |
          CARGO_VERSION="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Tag ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version match: $TAG_VERSION"
      - run: cargo publish --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
