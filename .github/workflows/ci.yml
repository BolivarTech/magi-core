name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --all-features
      # Additivity (R11): the core + rotation (4-condition, no probe) must compile
      # and pass with NO optional features — proving `ollama`/probe are additive and
      # the default path stays 2.0.x. The async-boundary tests (concurrent claim
      # stress, slot-guard cancellation/contended-drop, lost-signal recovery) are
      # ordinary `#[tokio::test]`s in this default suite, so they run here too.
      - name: Default-features build (additivity)
        run: cargo nextest run

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --tests -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: rustfmt
      - run: cargo fmt --check

  # Enforces the no-search rule mechanically. It is a ratchet against a KNOWN
  # regression: the brace-scanning heuristic that used to guess which JSON object was
  # the verdict, and the duplicate block locator that would let the prompt guard drift
  # out of step with the parser. A brand-new heuristic under a new name would pass it,
  # so this backs up review rather than replacing it. Needs full history for `git grep`.
  no-search-rule:
    name: R0 (no verdict search)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh ci/check_r0.sh

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - run: cargo generate-lockfile
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
