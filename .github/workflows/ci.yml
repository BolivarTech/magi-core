name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ONE list of checks, in `ci/run_all_checks.sh`, run by this workflow and by the release
  # workflow alike.
  #
  # These used to be a job per check here and the same sequence written out again in the release
  # workflow. The two drifted — the release path ended up running FEWER checks than the pull-request
  # path, which is the worst direction for that to go, since the run that publishes is the one doing
  # less. Nothing surfaced it; it was noticed by reading the two files side by side.
  #
  # The cost is that the checks now run in sequence rather than in parallel, so a failure is
  # reported one at a time and the job takes longer. That is a real loss, accepted: a check list
  # that cannot silently differ between "before merge" and "before publish" is worth more than a
  # faster red. What the script covers, both feature sets and why, is documented in the script.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the verdict-search rule uses `git grep` across it.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The declared MSRV, not `stable`. On `stable` every one of these would prove the crate
          # works on a toolchain no consumer is promised, which is not the claim they make.
          toolchain: "1.91"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Three guards in `ci/` are Python, and the runner image promises `python3`
      # but not `python`. Installing it explicitly is what keeps those three from
      # being the steps that fail for the wrong reason.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash ci/run_all_checks.sh

  # The smoke harness is its OWN cargo package with an empty `[workspace]`, so nothing the Gate
  # job runs ever reaches it — it was compiled and tested on one developer's machine and nowhere
  # else. That matters for two reasons beyond tidiness: it is a hard release prerequisite, and it
  # is the first EXTERNAL consumer of the `complete() -> Completion` break, so it is the only
  # thing that empirically prices that migration.
  #
  # Its own unit tests need no backend and no network — the scenarios that do are driven by the
  # binary, not by `cargo test` — so this job stays fast and deterministic. What it does NOT do is
  # run the harness against a live backend; that is SMOKE #1 and #2, which are release-cycle
  # steps, not per-push ones.
  smoke:
    name: Smoke Harness (unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smoke
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run

  # Separate because it needs a generated lockfile and network access to the advisory database, so
  # it fails for reasons that have nothing to do with this crate's code. Keeping it apart means an
  # advisory-database outage does not read as a gate failure.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - run: cargo generate-lockfile
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
