[package]
name = "magi-core"
version = "4.0.0"
edition = "2024"
rust-version = "1.91"
authors = ["Julian Bolivar"]
description = "LLM-agnostic multi-perspective analysis system inspired by MAGI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BolivarTech/magi-core"
homepage = "https://github.com/BolivarTech/magi-core"
readme = "README.md"
keywords = ["llm", "multi-agent", "consensus", "analysis", "magi"]
categories = ["algorithms", "asynchronous"]
# The smoke harness writes its release certificate here, and crates.io is
# IMMUTABLE: a certificate that slips into a published package cannot be taken
# out, only corrected by publishing again — which is what a doc-only release
# already cost this project once. Excluded in the same change that introduces
# the directory, not after.
#
# The knowledge graph is tracked in git on purpose — someone reading or
# contributing to this repository gets the structure map with the checkout. It
# is not, however, anything a consumer who wrote `magi-core = "4.0"` can use:
# it was 7.8 MB of a 9.8 MB package, of which 3.5 MB was a browser viewer, and
# cargo packages by "what git tracks" unless told otherwise. Tracked, yes;
# shipped, no. Whoever wants it takes it from the repository or the tag.
#
# `.gitignore` goes with them, for a different reason: it is repository
# management with nothing in it for a consumer, and its section headers name the
# local tooling — which the standard this crate is written to forbids in anything
# that ships. Excluding it settles that without losing the file for contributors.
#
# `tests/`, `.github/` and `ci/` are excluded on the same ground as `graphify-out/`
# above: none of them serves anyone who writes `magi-core = "4.1"` in their own
# Cargo.toml. `tests/` and `.github/` are this crate's own test suite and CI
# wiring; `ci/` is the shell-script gate this repository runs on itself. A
# consumer does not run any of the three, and cargo packages by "what git
# tracks" unless told otherwise, so without this line all three shipped anyway.
#
# Measured before and after this line was added: `cargo package --list` went from
# 179 files to 59, a drop of 120. AS OF THIS COMMIT -- the count moved inside this
# branch when three more guards landed in `ci/`, so an unmarked figure here goes
# stale the same way. Re-measure rather than trusting the number. The count is recorded here so a future growth of the package is
# something the next reader can see, rather than something that just happens.
#
# EXPECTED WARNINGS, recorded so a future reader does not read them as a defect:
# excluding `tests/` makes `cargo package` emit one "ignoring test X as
# tests/X.rs is not included in the published package" line per integration
# test. That is the exclusion working, not a problem -- the package ships no test
# SUITE to run. It does still ship `tests/fixtures/`, which the `#[cfg(test)]`
# modules under `src/` read; see the note on the exclude entries below.
#
# One exception, decided rather than overlooked: a test-only binary at
# `src/bin/stub_cli.rs` WILL ship when a later milestone adds it. Neither that
# file nor any `[[bin]]` section exists in this tree yet, so this paragraph is
# about a decision, not about current contents. `required-features` on that
# entry will stop it from being BUILT by default; it does not stop it from
# being PACKAGED, and it is deliberately not excluded here -- carving it out
# would reopen the scope of an already-approved milestone. Built and packaged
# are two different questions, and only the first is what `required-features`
# answers.
exclude = [
    "docs/test/",
    "graphify-out/",
    ".graphifyignore",
    ".gitignore",
    # NOT `tests/` wholesale, and the reason was found by executing rather than by
    # reading: TEN `include_str!` calls in FOUR shipped `src/` modules reach into
    # `tests/fixtures/` from inside `#[cfg(test)]` -- `prompts/mod.rs`, `reporting.rs`,
    # `providers/ollama_wire.rs`, `providers/openai_compat.rs`. Excluding the whole
    # directory left those four modules in the tarball pointing at fixtures that are not,
    # so `cargo test` on the published source failed to COMPILE.
    #
    # Ordinary consumers never saw it -- `cfg(test)` is not set for a dependency -- but
    # distribution packagers build tests from the crates.io tarball, and crates.io is
    # immutable. No gate could have caught it either: `cargo package`'s verification
    # runs `cargo build`, and `check_packaged_consumer.sh` compiles `examples/`.
    #
    # So the suite goes and the fixtures stay. Listed explicitly rather than as a
    # negation, because a `!` rule silently depends on ordering; the cost is that a
    # NEW subdirectory of `tests/` would ship until someone adds it here, which is
    # noise rather than breakage -- the safe direction.
    "tests/*.rs",
    "tests/common/",
    "tests/support/",
    ".github/",
    "ci/",
]

[dependencies]
thiserror = "2"
tracing = "~0.1.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["time", "rt", "process", "io-util", "sync"] }
reqwest = { version = "0.13", features = ["json"], optional = true }
fastrand = "~2"
unicode-normalization = "~0.1.24"
caseless = "~0.2.2"
sha2 = "0.10"

[features]
claude-api = ["dep:reqwest"]
claude-cli = []
openai-compat = ["dep:reqwest"]
# OllamaProvider speaks the NATIVE /api/chat path for completions since 4.0.0, plus the native
# /api/show + /api/tags probes (window + digest). The edge on `openai-compat` remains because it
# is what supplies `reqwest` and the shared provider-URL machinery, NOT because the completions
# path is shared any more. HTTP-thin, no new deps.
ollama = ["openai-compat"]
# Exposes RoutingMockProvider for downstream integration tests. Its surface is
# covered by the crate's stability policy like any other public item (ADR 005), so
# it moves on a minor at the earliest.
test-utils = []

# docs.rs builds with the DEFAULT feature set, and this crate declares no `default`.
# Without these two lines every provider module is `#[cfg]`-ed out of the published
# documentation: docs.rs/magi-core/3.2.0 renders `providers` with no items at all, while
# the README and the crate root point readers straight at them. Verified against the live
# page for the previous release rather than predicted.
[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serial_test = "3"
reqwest = { version = "0.13", features = ["json"] }

[[example]]
name = "basic_analysis"
